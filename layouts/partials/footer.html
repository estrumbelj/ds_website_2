<footer class="site-footer">
  <div class="site-footer__grid">
    <div>
      <img src="{{ "img/logo.png" | relURL }}" alt="{{ site.Title }}" width="85" height="30">
      <p class="site-footer__about">{{ site.Params.address }}</p>
    </div>
    <div>
      <div class="site-footer__label">Site</div>
      <div class="site-footer__links site-footer__links--site">
        {{- range site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{- end }}
        <a href="{{ "news/" | relURL }}">News archive</a>
      </div>
    </div>
    <div>
      <div class="site-footer__label">Contact</div>
      <div class="site-footer__links">
        <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
        <a href="{{ site.Params.faculty }}">fri.uni-lj.si</a>
        <a href="{{ site.Params.linkedin }}">LinkedIn</a>
      </div>
    </div>
  </div>
  <div class="site-footer__bar">
    <div>© {{ site.Params.since }}–{{ now.Format "2006" }} {{ site.Title }}</div>
  </div>
</footer>
