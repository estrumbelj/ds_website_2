{{- $cur := .RelPermalink -}}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ "/" | relURL }}">
      <img src="{{ "img/logo.png" | relURL }}" alt="{{ site.Title }}" width="114" height="40">
    </a>

    <nav class="site-nav" aria-label="Main">
      {{- range site.Menus.main }}
        {{- $active := or (eq $cur .URL) (and (ne .URL "/") (hasPrefix $cur .URL)) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>

    <button class="burger" type="button" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Main, mobile">
      {{- range site.Menus.main }}
        {{- $active := or (eq $cur .URL) (and (ne .URL "/") (hasPrefix $cur .URL)) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
<script>
  (function () {
    var b = document.getElementById('burger'),
        n = document.getElementById('mobile-nav');
    if (!b || !n) return;
    b.addEventListener('click', function () {
      var open = n.classList.toggle('is-open');
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
