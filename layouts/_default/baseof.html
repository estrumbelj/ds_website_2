<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" style="color-scheme: light">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="page-shell">
      <a class="skip-link" href="#main">Skip to content</a>
      {{ partial "header.html" . }}
      <main id="main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ block "scripts" . }}{{ end }}
  </body>
</html>
