# Core benefits of an industry partnership. Mirrors content/partnership.md.
benefits:
  - title: Publicity
    body: Your name on the programme, on this site, and at every event you support.
  - title: Workshops and lectures
    body: Free workshop places and advertising, plus invited lectures to our students.
  - title: Projects and theses
    body: Help identifying problems suited to student projects or Master's theses, and introductions to the researchers working in that area.
  - title: A say in the programme
    body: Participation in forming the future of the DataScience@UL-FRI initiative and its educational programmes.
